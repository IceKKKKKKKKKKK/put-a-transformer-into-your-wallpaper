<!doctype html>
<html lang="en" data-theme="black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transformer Explainer Wallpaper</title>
  <style>
    :root { --frame-height: 900px; --vertical-offset: 0px; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; }
    iframe {
      display: block;
      width: 100%;
      height: min(var(--frame-height), 100vh);
      border: 0;
      transform: translateY(var(--vertical-offset));
      background: #fff;
      /* Slightly lift lines and labels against pure black without crushing dim details. */
      filter: invert(1) hue-rotate(180deg) brightness(1.10);
    }
    html[data-theme="white"], html[data-theme="white"] body { background: #fff; }
    html[data-theme="white"] iframe { filter: none; }
    #startup { position: absolute; color: #aaa; font: 16px Arial, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <!-- Visualization and model: Polo Club's Transformer Explainer. See CREDIT.md. -->
  <div id="startup" role="status">Waiting for the local GPU service…<br>Run scripts/Start-LocalGpu.ps1 if it is stopped.</div>
  <iframe id="explainer" title="Interactive Transformer Explainer" style="visibility:hidden"
    src="about:blank" allow="autoplay"></iframe>
  <script>
    // Wait for the local service, including when Lively starts first at sign-in.
    // An image probe works from Lively's file origin without opening CORS access.
    function connectLocal() {
      const probe = new Image();
      probe.onload = () => {
        const frame = document.getElementById('explainer');
        frame.src = 'http://127.0.0.1:8765/transformer-explainer/';
        frame.style.visibility = 'visible';
        document.getElementById('startup').hidden = true;
      };
      probe.onerror = () => setTimeout(connectLocal, 2000);
      probe.src = 'http://127.0.0.1:8765/api/ready.png?t=' + Date.now();
    }
    connectLocal();
    // Presentation controls shared by both themes.
    function livelyPropertyListener(name, value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return;
      if (name === 'theme' && (number === 0 || number === 1)) {
        document.documentElement.dataset.theme = number === 1 ? 'white' : 'black';
      } else if (name === 'frameHeight') {
        document.documentElement.style.setProperty('--frame-height', `${Math.max(700, Math.min(1440, number))}px`);
      } else if (name === 'verticalOffset') {
        document.documentElement.style.setProperty('--vertical-offset', `${Math.max(-200, Math.min(200, number))}px`);
      }
    }
  </script>
</body>
</html>
